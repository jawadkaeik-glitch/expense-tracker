{% extends "base.html" %}

{% block title %}Add Expense - WealthPulse AI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <div class="card-title">
            <span>➕ Add New Expense</span>
            <a href="{{ url_for('list_expenses') }}" class="btn-secondary" style="font-size: 0.85rem;">← Back to Expenses</a>
        </div>
        <form method="POST" action="/add">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="description">Description *</label>
                    <input type="text" id="description" name="description" class="form-control" placeholder="e.g. Grocery Shopping, Gas, Rent" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($) *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control">
                        {% if categories %}
                            {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="Food">Food</option>
                            <option value="Transportation">Transportation</option>
                            <option value="Housing">Housing</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Health">Health</option>
                            <option value="General">General</option>
                        {% endif %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ today if today else '' }}">
                </div>
                <div class="form-group">
                    <label for="payment_method">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-control">
                        {% if payment_methods %}
                            {% for method in payment_methods %}
                                <option value="{{ method }}">{{ method }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="Card">Card</option>
                            <option value="Cash">Cash</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        {% endif %}
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="notes">Notes (Optional)</label>
                    <input type="text" id="notes" name="notes" class="form-control" placeholder="Additional details...">
                </div>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('list_expenses') }}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Add Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
