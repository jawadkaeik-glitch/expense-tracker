{% extends "base.html" %}

{% block title %}Edit Expense - WealthPulse AI{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
    <div class="card">
        <div class="card-title">
            <span>✏️ Edit Expense</span>
            <a href="{{ url_for('list_expenses') }}" class="btn-secondary" style="font-size: 0.85rem;">← Back to Expenses</a>
        </div>
        <form method="POST" action="{{ url_for('edit_expense', id=expense.id) }}">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="description">Description *</label>
                    <input type="text" id="description" name="description" class="form-control" value="{{ expense.description }}" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($) *</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" value="{{ expense.amount }}" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-control">
                        {% for cat in categories %}
                            <option value="{{ cat }}" {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ expense.date }}">
                </div>
                <div class="form-group">
                    <label for="payment_method">Payment Method</label>
                    <select id="payment_method" name="payment_method" class="form-control">
                        {% for method in payment_methods %}
                            <option value="{{ method }}" {% if expense.payment_method == method %}selected{% endif %}>{{ method }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="notes">Notes (Optional)</label>
                    <input type="text" id="notes" name="notes" class="form-control" value="{{ expense.notes or '' }}">
                </div>
            </div>
            <div class="form-actions">
                <a href="{{ url_for('list_expenses') }}" class="btn-secondary">Cancel</a>
                <button type="submit" class="btn-primary">Update Expense</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
