{% extends "base.html" %}

{% block title %}Edit Income — KashFlow{% endblock %}

{% block content %}
<div style="max-width: 580px; margin: 1.5rem auto;">
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Edit Income</h3>
            <a href="{{ url_for('list_incomes') }}" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.3rem 0.6rem;">&larr; Back to Incomes</a>
        </div>
        <form method="POST" action="{{ url_for('edit_income', id=income.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="form-group">
                <label class="form-label" for="description">Description</label>
                <input type="text" id="description" name="description" class="form-control" value="{{ income.description }}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="amount">Amount ($)</label>
                    <input type="number" step="0.01" min="0.01" id="amount" name="amount" class="form-control" value="{{ income.amount }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="category">Category</label>
                    <select id="category" name="category" class="form-control">
                        {% for cat in categories %}
                            <option value="{{ cat }}" {% if income.category == cat %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ income.date }}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="source">Source / Method</label>
                    <select id="source" name="source" class="form-control">
                        {% for method in payment_methods %}
                            <option value="{{ method }}" {% if income.source == method %}selected{% endif %}>{{ method }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="notes">Notes</label>
                <input type="text" id="notes" name="notes" class="form-control" value="{{ income.notes or '' }}">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.5rem;">
                <a href="{{ url_for('list_incomes') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-income">Update Income</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
